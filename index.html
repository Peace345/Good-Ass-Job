<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Good Ass Job</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #111;
      color: white;
      text-align: center;
    }

    #player {
      padding: 20px;
    }

    #cover {
      width: 250px;
      height: 250px;
      object-fit: cover;
      margin-top: 10px;
      border-radius: 10px;
    }

    .song {
      padding: 10px;
      margin: 5px auto;
      width: 60%;
      background: #222;
      cursor: pointer;
      border-radius: 5px;
    }

    .song:hover {
      background: #333;
    }

    button {
      margin: 10px;
      padding: 10px 15px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div id="player">

  <!-- BACK BUTTON -->
  <button onclick="goBack()">⬅ Back to Library</button>

  <!-- ALBUM INFO -->
  <h1 id="albumTitle">Good Ass Job</h1>
  <img id="cover" src="" alt="cover">

  <!-- SONG LIST -->
  <div id="songs"></div>

</div>

<audio id="audio"></audio>

<button id="playPauseBtn" onclick="togglePlay()">▶️ Play</button>

<script>

let currentAlbum = {
  name: "Good Ass Job",
    cover: "newgoodasscover.jpg",
    songs: [
      { file: "goodassjobintro.mp3", title: "Intro", artist: "Kanye West" },
      { file: "seemenow.mp3", title: "See Me Now", artist: "Kanye West, Beyoncé, Charlie Wilson, Big Sean" },
      { file: "christiandiordenimflow.mp3", title: "Christian Dior Denim Flow", artist: "Kanye West, Kid Cudi, Pusha T, John Legend, Lloyd Banks, Ryan Leslie" },
      { file: "shootup.mp3", title: "Shoot Up", artist: "Kanye West, Santigold, Bon Iver" },
      { file: "livefastdieyoung.mp3", title: "Live Fast Die Young", artist: "Kanye West, Rick Ross, Tony Williams, Connie Mitchell" },
      { file: "dontlookdown.mp3", title: "Don't Look Down", artist: "Kanye West, Mos Def, Lupe Fiasco, Big Sean" },
      { file: "takeonefortheteam.mp3", title: "Take One For The Team", artist: "Kanye West, Keri Hilson, Pusha T, CyHi" },
      { file: "heartbreaker.mp3", title: "Heartbreaker", artist: "Kanye West" },
      { file: "chainheavy.mp3", title: "Chain Heavy", artist: "Kanye West, Talib Kweli, Consequence" },
      { file: "downtown.mp3", title: "Downtown", artist: "Kanye West, Jeezy" },
      { file: "lonely.mp3", title: "Lonely", artist: "Kanye West" },
      { file: "throwmoneyeverywhere.mp3", title: "Throw Money Everywhere", artist: "Kanye West" },
      { file: "whitedress.mp3", title: "White Dress", artist: "Kanye West" },
      { file: "eyezcloesd.mp3", title: "Eyez Closed", artist: "Kanye West, John Legend" },
      { file: "lookingfortrouble.mp3", title: "Looking For Trouble", artist: "Kanye West, Pusha T, Big Sean, CyHi, J Cole" },
      { file: "flashinglightsii.mp3", title: "Flashing Lights II", artist: "Kanye West, Charlie Wilson" },
      { file: "mamasboyfriends.mp3", title: "Mamas Boyfriends", artist: "Kanye West" },
      { file: "neverseemeagain.mp3", title: "Never See Me Again", artist: "Kanye West" },
      { file: "glenwood.mp3", title: "Glenwood", artist: "Kanye West, Big Sean" },
      { file: "flightschool.mp3", title: "Flight School", artist: "Kanye West, GLC, T-Pain" },
      { file: "diamonds.mp3", title: "Diamonds", artist: "Kanye West" },
      { file: "tragicallybeautiful.mp3", title: "Tragically Beautiful", artist: "Kanye West" },
      { file: "goodassjob.mp3", title: "Good Ass Job", artist: "Kanye West, Rhymefest, Mikkey Halsted" },
      { file: "nopartiesinla.mp3", title: "No Parties In LA", artist: "Kanye West, Mr. Hudson, Elly Jackson" },
      { file: "icecube.mp3", title: "Ice Cube", artist: "Kanye West" },
      { file: "makethatmoney.mp3", title: "Make That Money", artist: "Kanye West" },
      { file: "aintnotellin.mp3", title: "Ain't No Tellin", artist: "Kanye West, GLC" },
      { file: "armina.mp3", title: "Armina", artist: "Kanye West" },
      { file: "hateit.mp3", title: "Hate It", artist: "Kanye West, JAY-Z, Kid Cudi" },
      { file: "crazylife.mp3", title: "Crazy Life", artist: "Kanye West" }
  ]
};

// BACK BUTTON (PUT MAIN REPO LINK HERE)
function goBack() {
  window.location.href = "https://peace345.github.io/Ye-Unreleased-Archive/"; // <-- paste main library repo URL here
}

// LOAD ALBUM
document.getElementById("albumTitle").innerText = currentAlbum.name;
document.getElementById("cover").src = currentAlbum.cover;

buildSongs();

// BUILD SONG LIST
function buildSongs() {
  const songsDiv = document.getElementById("songs");
  songsDiv.innerHTML = "";

  currentAlbum.songs.forEach((song, i) => {
    const div = document.createElement("div");
    div.className = "song";

    div.innerHTML = `
      <strong>${song.title}</strong><br>
      <small>${song.artist || ""}</small>
    `;

    div.onclick = () => playSong(i);

    songsDiv.appendChild(div);
  });
}

// PLAY SONG
function playSong(i) {
  currentIndex = i;

  const song = currentAlbum.songs[i];

  window.audio.src = song.file;
  window.audio.play();

  updateMediaSession(song, currentAlbum);
}

function updateMediaSession(song) {
  if (!('mediaSession' in navigator)) return;

  navigator.mediaSession.metadata = new MediaMetadata({
    title: song.title,
    artist: song.artist,
    album: currentAlbum.name,
    artwork: [
      { src: currentAlbum.cover, sizes: "512x512", type: "image/jpg" }
    ]
  });

  navigator.mediaSession.setActionHandler("play", () => {
    audio.play();
  });

  navigator.mediaSession.setActionHandler("pause", () => {
    audio.pause();
  });

  navigator.mediaSession.setActionHandler("previoustrack", () => {
    if (!currentAlbum) return;
    currentIndex = (currentIndex - 1 + currentAlbum.songs.length) % currentAlbum.songs.length;
    playSong(currentIndex);
  });

  navigator.mediaSession.setActionHandler("nexttrack", () => {
    if (!currentAlbum) return;
    currentIndex = (currentIndex + 1) % currentAlbum.songs.length;
    playSong(currentIndex);
  });
}

  if ("mediaSession" in navigator) {

  navigator.mediaSession.setActionHandler("play", async () => {
    await audio.play();
  });

  navigator.mediaSession.setActionHandler("pause", () => {
    audio.pause();
  });

}

function togglePlay() {
  if (audio.paused) {
    audio.play();
  } else {
    audio.pause();
  }
}

  audio.addEventListener("play", () => {
  document.getElementById("playPauseBtn").innerText = "⏸️ Pause";
});

audio.addEventListener("pause", () => {
  document.getElementById("playPauseBtn").innerText = "▶️ Play";
});

window.addEventListener("DOMContentLoaded", () => {

  const audio = document.getElementById("audio");

  audio.addEventListener("ended", () => {
    if (!currentAlbum) return;

    const nextIndex = currentIndex + 1;

    if (nextIndex < currentAlbum.songs.length) {
      playSong(nextIndex);
    } else {
      playSong(0);
    }
  });

  // expose audio globally so playSong can use it safely
  window.audio = audio;
});
  
</script>

</body>
</html>
